    function toast(title,message){state.notice={title,message};render()}
    function money(n){return '$'+Number(n).toLocaleString('es-MX')+' MXN'}
    function metrics(a){const hist=a.history||[],done=hist.filter(x=>x.done);const km=done.reduce((s,x)=>s+x.km,0);const avgHr=Math.round(done.reduce((s,x)=>s+x.hr,0)/Math.max(done.length,1));const avgRpe=(done.reduce((s,x)=>s+x.rpe,0)/Math.max(done.length,1)).toFixed(1);const completion=Math.round(done.length/Math.max(hist.length,1)*100);const quality=done.filter(x=>['Tempo','Series'].includes(x.type)).length;const load=Math.round(km*2.1+avgHr/4+quality*9);const longest=done.reduce((b,x)=>x.km>b.km?x:b,{km:0,type:'—'});const trend=done.slice(-6).map(x=>Math.max(18,Math.round(x.km*5)));return{hist,done,totalKm:km.toFixed(1),avgHr,avgRpe,completion,load,longest,trend}}
    function statusColor(s){if(['Activo','Activa'].includes(s))return'green';if(['Bloqueado','Cancelado'].includes(s))return'red';if(s==='Trial')return'amber';return'blue'}
    function riskColor(s){if(s==='Alto')return'red';if(s==='Medio')return'amber';return'green'}
    function riskScore(a){const m=metrics(a);let score=100-a.compliance;if(a.risk==='Alto')score+=25;if(a.risk==='Medio')score+=12;if(a.payment!=='Pagado')score+=18;if(a.status!=='Activo')score+=18;if(a.fatigue>=7)score+=14;score+=Math.max(0,m.hist.length-m.done.length)*6;return Math.max(0,Math.min(100,score))}
    function badge(t,c='blue'){return `<span class="badge ${c}">${esc(t)}</span>`}
    function panel(c,klass='',neon=''){return `<div class="panel ${klass}">${c}</div>`}
    function kpi(icon,label,value,sub,color='blue'){return panel(`<div class="kpi-inner"><div class="kpi-icon">${icon}</div><div><p>${esc(label)}</p><h3>${esc(value)}</h3><small>${esc(sub)}</small></div></div>`,'kpi')}
    function progress(v,color='bg'){return `<div class="bar"><div style="width:${Math.min(100,Math.max(0,v))}%;background:${color==='amber'?'var(--amber)':'var(--cyan)'}"></div></div>`}
    function spark(vals){return `<div class="spark" style="display:flex;align-items:end;gap:4px;height:42px;margin-top:8px">${(vals.length?vals:[18,26,24,34]).map(v=>`<div style="height:${v}px;flex:1;border-radius:6px 6px 0 0;background:rgba(52,211,153,.75)"></div>`).join('')}</div>`}
    function metricBox(label,value,sub){return `<div class="metric"><p>${esc(label)}</p><h4>${esc(value)}</h4><small>${esc(sub)}</small></div>`}
    function action(icon,label,fn,danger=false){return `<button class="action-btn ${danger?'danger':''}" onclick="${fn}"><div style="font-size:18px">${icon}</div>${esc(label)}</button>`}

    window.setAuthRole=role=>{state.auth.role=role;state.auth.email=users[role].email;state.auth.password=users[role].password;render()}
    window.login=()=>{const u=users[state.auth.role];if($('email').value===u.email&&$('password').value===u.password){state.session={role:state.auth.role,name:u.name};toast('Sesión iniciada','Entraste como '+u.label)}else toast('Credenciales inválidas','Usa las credenciales demo precargadas.')}
    window.quickLogin=role=>{state.auth.role=role;state.auth.email=users[role].email;state.auth.password=users[role].password;state.session={role,name:users[role].name};toast('Sesión iniciada','Entraste como '+users[role].label)}
    window.logout=()=>{state.session=null;toast('Sesión cerrada','Volviste al onboarding.')}
    window.setPage=(role,page)=>{state.page[role]=page;render()}
    window.selectAthlete=id=>{state.selectedId=id;render()}
    window.setSearch=v=>{state.search=v;render()}
    window.closeModal=()=>{state.modal=null;render()}
    window.openModal=(m)=>{state.form={};state.modal=m;render()}
    window.closeToast=()=>{state.notice=null;render()}

    function selectedAthlete(){if(state.session?.role==='athlete')return state.athletes.find(a=>a.id===users.athlete.athleteId)||state.athletes[0];return state.athletes.find(a=>a.id===state.selectedId)||state.athletes[0]}
    function updateAthlete(id,patch){state.athletes=state.athletes.map(a=>a.id===id?{...a,...patch}:a)}
    window.toggleIntegration=key=>{const a=selectedAthlete();updateAthlete(a.id,{[key]:!a[key]});toast('Integración actualizada',(key==='strava'?'Strava':'Garmin')+' cambió de estado.')}
    window.blockAthlete=()=>{const a=selectedAthlete();updateAthlete(a.id,{status:'Bloqueado',payment:'Vencido',risk:'Alto'});toast('Atleta bloqueado','Se bloqueó por falta de pago.')}
    window.reactivateAthlete=()=>{const a=selectedAthlete();updateAthlete(a.id,{status:'Activo',payment:'Pagado',risk:'Bajo'});toast('Acceso reactivado','El atleta vuelve a tener acceso al plan.')}
    window.cancelAthlete=()=>{const a=selectedAthlete();updateAthlete(a.id,{status:'Cancelado',payment:'Cancelado',risk:'—'});toast('Atleta dado de baja','El historial queda conservado.')}
    window.markDone=()=>{const a=selectedAthlete();const item={type:'Today',km:6.2,min:38,pace:'6:08',hr:149,rpe:5,done:true};updateAthlete(a.id,{history:[...a.history,item],compliance:Math.min(100,a.compliance+3),streak:a.streak+1});toast('Sesión completada','Se actualizaron métricas e historial.')}
    window.createAthlete=()=>{const name=$('newAthleteName').value.trim();if(!name)return;const email=$('newAthleteEmail').value||'nuevo@demo.com';const id=Date.now();state.athletes=[{id,name,email,status:'Activo',risk:'Bajo',payment:'Trial',distance:'10K',week:1,compliance:0,fatigue:2,streak:0,strava:false,garmin:false,history:[],schedule:schedule('10K',1),records:{'5K':'—','10K':'—','21K':'—'},notes:'Atleta creado en demo.'},...state.athletes];state.selectedId=id;state.modal=null;toast('Atleta creado','El atleta se agregó al dashboard del coach.')}
    window.createCoach=()=>{const name=$('newCoachName').value.trim();if(!name)return;const plan=$('newCoachPlan').value,seats=Number($('newCoachSeats').value||10);state.coaches=[{id:Date.now(),name,plan,seats,used:0,status:'Trial',renewal:'30/07/2026'},...state.coaches];state.modal=null;toast('Coach agregado','La licencia quedó creada en modo trial.')}
    window.changeBrand=c=>{state.brandColor=c;document.documentElement.style.setProperty('--brand',c);toast('Color actualizado','La marca del demo cambió de acento.')}
    window.addLibrary=()=>{state.library=[{id:Date.now(),title:'Nueva sesión personalizada',meta:'Personalizada · 45 min',category:'Coach',desc:'Sesión creada desde el demo para reutilizar con atletas.'},...state.library];toast('Biblioteca actualizada','Se agregó una nueva plantilla.')}
    window.assignSession=()=>{const a=selectedAthlete();const day=Number($('assignDay').value);const tpl=state.library.find(x=>x.id===$('assignTpl').value)||state.library[0];const next=a.schedule.map((s,i)=>i===day?{...s,title:tpl.title,meta:tpl.meta,description:tpl.desc}:s);updateAthlete(a.id,{schedule:next});state.modal=null;toast('Sesión asignada',`${tpl.title} quedó en ${dayNames[day]}.`)}
    window.releaseWeek=()=>{const a=selectedAthlete();const distance=$('releaseDistance').value,week=Number($('releaseWeek').value);updateAthlete(a.id,{distance,week,schedule:schedule(distance,week),compliance:Math.min(100,a.compliance+2)});state.modal=null;toast('Semana liberada',`Semana ${week} de ${distance} disponible para ${a.name}.`)}
    window.sendCoachMessage=()=>{const a=selectedAthlete();const text=$('coachMessage').value.trim();if(!text)return;state.messages[a.id]=[...(state.messages[a.id]||[]),{id:Date.now(),from:'coach',text}];toast('Mensaje enviado','Quedó registrado en la conversación del atleta.');render()}
    window.sendAthleteMessage=()=>{const a=selectedAthlete();const text=$('athleteMessage').value.trim();if(!text)return;state.messages[a.id]=[...(state.messages[a.id]||[]),{id:Date.now(),from:'me',text}];toast('Mensaje enviado','Tu coach recibirá la respuesta.');render()}
    window.buyMarket=title=>toast('Marketplace',title+' agregado al demo.')

    function renderLogin(){
      const roles=[['admin','🛡️','Administrador','Licencias, marca blanca, cobros, límites y permisos.'],['coach','👥','Coach','Atletas, calendario, sesiones, biblioteca y métricas.'],['athlete','⚡','Atleta','Plan protegido, progreso, historial y mensajes.']];
      return `<div class="login-wrap"><section><div class="brand-row"><div class="pulse">⌁</div><h1>Pulse Coach <span>OS</span></h1></div><h2 class="hero-title">Onboarding multirol para operar la plataforma.</h2><p class="hero-p">Cada usuario entra por login y se envía a su interfaz correspondiente. Admin, coach y atleta conservan la lógica, métricas, semanas protegidas y funciones activas.</p><div class="role-grid">${roles.map(r=>`<button class="role-card ${state.auth.role===r[0]?'active':''}" onclick="setAuthRole('${r[0]}')"><span class="role-icon">${r[1]}</span><h3>${r[2]}</h3><p>${r[3]}</p></button>`).join('')}</div></section><section class="panel login-panel"><span class="badge cyan">🔒 Login demo</span><h2>Entrar a la plataforma</h2><p class="small">Selecciona tipo de usuario o usa los accesos rápidos.</p><label class="field"><span>Tipo de usuario</span><select onchange="setAuthRole(this.value)"><option value="admin" ${state.auth.role==='admin'?'selected':''}>Administrador</option><option value="coach" ${state.auth.role==='coach'?'selected':''}>Coach</option><option value="athlete" ${state.auth.role==='athlete'?'selected':''}>Atleta</option></select></label><label class="field"><span>Correo</span><input id="email" value="${esc(state.auth.email)}" oninput="state.auth.email=this.value"></label><label class="field"><span>Contraseña</span><input id="password" type="password" value="${esc(state.auth.password)}" oninput="state.auth.password=this.value"></label><button class="btn full" style="margin-top:16px" onclick="login()">Entrar como ${users[state.auth.role].label}</button><div class="quick-grid"><button class="btn ghost" onclick="quickLogin('admin')">Admin</button><button class="btn ghost" onclick="quickLogin('coach')">Coach</button><button class="btn ghost" onclick="quickLogin('athlete')">Atleta</button></div><div class="small" style="margin-top:16px;padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(0,0,0,.25)">Credenciales precargadas: <b style="color:white">demo123</b> para los tres roles.</div></section></div>`
    }

    function topbar(){return `<div class="panel topbar"><div class="topbar-left"><div class="pulse" style="font-size:34px">⌁</div><div><h1>Pulse Coach <span style="color:var(--cyan)">OS</span></h1><p>Sesión iniciada como ${users[state.session.role].label}</p></div></div><div class="page-actions">${badge(state.session.name,state.session.role==='admin'?'blue':state.session.role==='coach'?'purple':'cyan')}<button class="btn ghost" onclick="toast('Alertas','No hay alertas críticas en este momento.')">🔔 Alertas</button><button class="btn ghost" onclick="logout()">↩ Cerrar sesión</button></div></div>`}
    function sidebar(role,items){return `<div class="panel sidebar"><span class="badge ${role==='admin'?'blue':role==='coach'?'purple':'cyan'}">${users[role].label.toUpperCase()}</span><div class="nav">${items.map(x=>`<button class="${state.page[role]===x?'active':''}" onclick="setPage('${role}','${x}')">${navIcon(x)} ${x}</button>`).join('')}</div></div>`}
    function navIcon(x){const map={Licencias:'🔑','Facturación':'💳','Marca':'🎨','Marca blanca':'🎨','Usuarios':'👥','Límites':'📏','Integraciones':'🔗','Seguridad':'🛡️','Auditoría':'📄','Ajustes':'⚙️',Inicio:'📊',Atletas:'👥',Calendario:'📅',Sesiones:'🏃','Biblioteca':'📚',Mensajes:'💬',Evaluaciones:'📈',Riesgo:'⚠️',Informes:'📄',Resumen:'✨',Semana:'📅',Progreso:'📈',Historial:'🏅',Marketplace:'🛒'};return map[x]||'•'}
    function pageHead(title,sub,extra=''){return `<div class="page-head"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>${extra}</div>`}

    function adminView(){const page=state.page.admin;const nav=['Licencias','Facturación','Marca blanca','Usuarios','Límites','Integraciones','Seguridad','Auditoría','Ajustes'];let content='';if(page==='Licencias')content=adminLicenses();else if(page==='Marca blanca')content=adminBrand();else content=adminGeneric(page);return topbar()+`<div class="layout">${sidebar('admin',nav)}<main class="stack">${pageHead('Consola de administración',page,`<button class="btn" onclick="openModal('newCoach')">+ Nueva licencia</button>`)}<div class="kpis">${kpi('🔑','Licencias activas',String(state.coaches.length*25),'+8 este mes')}${kpi('👥','Usuarios activos','42 / 75','89% ocupación')}${kpi('💰','MRR demo','$41k','Proyección','green')}${kpi('✨','White-label','Listo','Personalizable')}${kpi('🛡️','Seguridad','2FA','Activo','green')}</div>${content}</main></div>`}
    function adminLicenses(){return panel(`<h3>Gestión de licencias</h3><div class="history-list">${state.coaches.map(c=>`<div class="risk-row" style="grid-template-columns:1fr 90px 120px 100px 110px"><b>${esc(c.name)}</b><span style="color:var(--cyan)">${esc(c.plan)}</span><span>${c.used}/${c.seats} seats</span>${badge(c.status,statusColor(c.status))}<span class="small">${c.renewal}</span></div>`).join('')}</div>`,'table-panel')}
    function adminBrand(){const colors=['#2563eb','#7c3aed','#06b6d4','#f97316','#ec4899','#10b981'];return panel(`<h3>Marca blanca</h3><p class="small">Personaliza color, dominio y experiencia del coach.</p><div style="display:flex;gap:10px;margin:18px 0">${colors.map(c=>`<button class="color-dot ${state.brandColor===c?'active':''}" style="background:${c}" onclick="changeBrand('${c}')"></button>`).join('')}</div><div class="metric"><p>Subdominio</p><h4>app.pulsoperformance.com</h4><small>Dominio demo activo</small></div>`,'table-panel')}
    function adminGeneric(page){return panel(`<h3>${esc(page)}</h3><div class="cards-grid" style="margin-top:14px">${['Configuración activa','Permisos','Historial','Reporte','Políticas','Estado'].map(x=>panel(`<h4>${x}</h4><p class="small">Módulo ${esc(page)} listo para demo comercial.</p><button class="btn ghost" onclick="toast('${x}','Configuración abierta en demo.')">Abrir</button>`,'card-box')).join('')}</div>`,'table-panel')}

    function coachView(){const page=state.page.coach;const nav=['Inicio','Atletas','Calendario','Sesiones','Biblioteca','Mensajes','Evaluaciones','Riesgo','Informes','Facturación','Ajustes'];let content= page==='Inicio'?coachHome(): page==='Atletas'?coachAthletes(): page==='Calendario'?calendarModule(): page==='Sesiones'?sessionsModule(): page==='Biblioteca'?libraryModule(): page==='Mensajes'?coachMessages(): page==='Evaluaciones'?evaluationsModule(): page==='Riesgo'?riskModule(): page==='Informes'?reportsModule(): page==='Facturación'?billingModule(): settingsModule();return topbar()+`<div class="layout">${sidebar('coach',nav)}<main class="stack">${coachHeader(page)}${content}</main></div>`}
    function coachHeader(page){return pageHead(page==='Inicio'?'Dashboard':page,'Módulo interactivo del coach',`<div class="search">🔎<input value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="Buscar atleta..."></div><button class="btn" onclick="openModal('newAthlete')">+ Acción rápida</button>`)}
    function filteredAthletes(){return state.athletes.filter(a=>a.name.toLowerCase().includes(state.search.toLowerCase()))}
    function coachHome(){const avg=Math.round(state.athletes.reduce((s,a)=>s+a.compliance,0)/state.athletes.length);return `<div class="kpis">${kpi('👥','Atletas activos',String(state.athletes.filter(a=>a.status==='Activo').length*8),'+12% vs mes')}${kpi('🛡️','Cumplimiento',avg+'%','Promedio','green')}${kpi('📚','Sesiones','166','Esta semana')}${kpi('💰','Ingresos','$4,782','Mes','green')}${kpi('🔒','En riesgo',String(state.athletes.filter(a=>a.risk!=='Bajo').length),'Atención','orange')}</div>${coachMainPanel()}<div class="two-col">${integrationsPanel()}${libraryPanel()}</div>${featureGrid()}${riskEngine()}`}
    function coachMainPanel(){const a=selectedAthlete();const m=metrics(a);return `<div class="grid-main"><div class="panel table-panel"><div class="table-head"><h3>ATLETAS</h3><div>${badge('Todos '+filteredAthletes().length)} ${badge('Activos '+filteredAthletes().filter(x=>x.status==='Activo').length,'green')}</div></div><div class="table-grid"><span>Atleta</span><span>Estado</span><span>Riesgo</span><span>Cumplimiento</span><span>Pago</span><span>Última</span></div><div>${filteredAthletes().map(athleteRow).join('')}</div></div>${selectedPanel(a,m)}</div>`}
    function athleteRow(a){return `<button class="athlete-row ${a.id===selectedAthlete().id?'active':''}" onclick="selectAthlete(${a.id})"><span><span class="avatar"></span>${esc(a.name)}</span>${badge(a.status,statusColor(a.status))}${badge(a.risk,riskColor(a.risk))}<span><b>${a.compliance}%</b>${progress(a.compliance,a.compliance<60?'amber':'cyan')}</span><span style="color:${a.payment==='Pagado'?'var(--green)':'var(--amber)'}">${esc(a.payment)}</span><span class="small">Hoy</span></button>`}
    function selectedPanel(a,m){return `<div class="panel selected"><div class="person"><div class="person-left"><div class="big-avatar"></div><div><h3>${esc(a.name)}</h3><p>${a.distance} · Semana ${a.week}</p></div></div>${badge(a.status,statusColor(a.status))}</div><div class="mini-tabs"><span style="color:var(--cyan)">Resumen</span><span>Plan</span><span>Progreso</span><span>Mensajes</span><span>Historial</span></div><div class="metric-grid">${metricBox('Cumplimiento',a.compliance+'%','Óptimo')}${metricBox('Riesgo',a.risk,'Risk Engine')}${metricBox('Fatiga',a.fatigue+'/10','Actual')}${metricBox('Racha',a.streak+' días','Actual')}</div><div class="split2"><div class="panel" style="padding:12px"><p class="small">Carga de entrenamiento</p><h2>${m.load}</h2><p class="small" style="color:var(--green)">${m.totalKm} km completados</p>${spark(m.trend)}</div><div class="panel" style="padding:12px"><p class="small">Sesiones completadas</p><h2>${m.done.length} de ${m.hist.length}</h2>${progress(m.completion)}<p class="small" style="text-align:right;color:var(--green)">${m.completion}%</p></div></div><div class="actions">${action('💬','Mensaje',"openModal('message')")}${action('📅','Asignar',"openModal('assign')")}${action('👁️','Liberar',"openModal('release')")}${action('🔒','Bloquear','blockAthlete()',true)}${action('🔓','Reactivar','reactivateAthlete()')}</div><button class="btn ghost full" style="margin-top:10px" onclick="markDone()">✓ Simular entrenamiento completado</button></div>`}
    function integrationsPanel(){const a=selectedAthlete();return panel(`<p class="small" style="text-transform:uppercase;font-weight:900">Sincronizaciones activas</p><div class="split2"><button class="panel card-box" onclick="toggleIntegration('strava')"><h3 style="color:#fb923c">STRAVA</h3><p class="small">${a.strava?'Conectado':'Pendiente'}</p></button><button class="panel card-box" onclick="toggleIntegration('garmin')"><h3 style="color:#60a5fa">GARMIN</h3><p class="small">${a.garmin?'Conectado':'Pendiente'}</p></button></div><p class="small">Última sincronización: Hoy 08:45</p>`,'table-panel')}
    function libraryPanel(){return panel(`<div class="table-head"><h3>Biblioteca de sesiones</h3><button class="btn ghost" onclick="openModal('assign')">Asignar</button></div><div class="history-list">${state.library.slice(0,4).map(i=>`<div class="library-item"><div class="library-thumb"></div><div><b>${esc(i.title)}</b><p class="small">${esc(i.meta)}</p></div></div>`).join('')}</div><button class="btn ghost full" style="margin-top:12px" onclick="addLibrary()">+ Crear plantilla</button>`,'table-panel')}
    function featureGrid(){const features=[['🛡️','Licencias','Planes y límites'],['👥','Atletas','Control total'],['📚','Biblioteca','Sesiones reusable'],['👁️','Semana protegida','Anti-copia'],['⌚','Strava + Garmin','Sincronización'],['💰','Cobros','Bloqueo pago'],['✨','Marca blanca','Dominio propio']];return `<div><p class="small" style="font-weight:900;letter-spacing:.15em;text-transform:uppercase">Todo lo que necesitas para escalar tu negocio</p><div class="feature-grid">${features.map(f=>panel(`<div style="font-size:24px">${f[0]}</div><h4>${f[1]}</h4><p>${f[2]}</p>`,'feature')).join('')}</div></div>`}
    function riskEngine(){const high=state.athletes.filter(a=>a.risk==='Alto').length;const risk=state.athletes.filter(a=>a.risk!=='Bajo'&&a.status!=='Cancelado').length;return panel(`<div style="display:grid;grid-template-columns:1fr 120px 120px 160px 160px;gap:14px;align-items:center"><div><b>RISK ENGINE</b><p class="small">Detecta atletas en riesgo antes de que se desconecten.</p></div><div style="text-align:center"><h3>${risk}</h3><p class="small">En riesgo</p></div><div style="text-align:center"><h3 style="color:var(--red)">${high}</h3><p class="small">Alto riesgo</p></div><div style="text-align:center"><h3>68%</h3><p class="small">Prevención</p></div>${spark([10,14,16,21,18,25,29,34])}</div>`,'table-panel')}
    function coachAthletes(){const a=selectedAthlete(),m=metrics(a);return `<div class="grid-main"><div class="panel table-panel"><h3>Gestión completa de atletas</h3>${filteredAthletes().map(x=>`<button class="event" onclick="selectAthlete(${x.id})"><b>${x.name}</b><span style="float:right">${badge(x.status,statusColor(x.status))}</span><p>${x.distance} · Semana ${x.week} · ${x.payment}</p>${progress(x.compliance)}</button>`).join('')}</div>${selectedPanel(a,m)}</div><div class="panel table-panel"><div class="page-actions"><button class="btn" onclick="openModal('newAthlete')">+ Nuevo atleta</button><button class="btn ghost" onclick="openModal('assign')">Asignar sesión</button><button class="btn ghost" onclick="openModal('release')">Liberar semana</button><button class="btn danger" onclick="blockAthlete()">Bloquear</button><button class="btn ghost" onclick="reactivateAthlete()">Reactivar</button><button class="btn danger" onclick="cancelAthlete()">Dar de baja</button></div></div>`}
    function calendarModule(){return panel(`<h3>Calendario semanal</h3><div class="calendar">${dayNames.map((d,i)=>`<div class="day-card"><h4>${d}</h4>${state.athletes.filter(a=>a.status==='Activo').slice(0,4).map(a=>`<button class="event" onclick="selectAthlete(${a.id})"><b>${a.name}</b><p>${a.schedule[i]?.title||'Sin sesión'}</p></button>`).join('')}</div>`).join('')}</div>`,'table-panel')}
    function sessionsModule(){const a=selectedAthlete();return panel(`<div class="table-head"><h3>Sesiones de ${esc(a.name)}</h3><button class="btn" onclick="openModal('assign')">+ Asignar</button></div><div class="session-grid">${a.schedule.map(s=>`<div class="history-item">${badge(s.label,'cyan')}<h3>${esc(s.title)}</h3><p class="small">${esc(s.meta)}</p><p class="small">${esc(s.description)}</p><button class="btn ghost full" onclick="markDone()">Completar</button></div>`).join('')}</div>`,'table-panel')}
    function libraryModule(){return `<div class="page-actions" style="justify-content:flex-end"><button class="btn" onclick="addLibrary()">+ Nueva plantilla</button></div><div class="cards-grid">${state.library.map(i=>panel(`${badge(i.category,'purple')}<h3>${esc(i.title)}</h3><p style="color:var(--cyan)" class="small">${esc(i.meta)}</p><p class="small">${esc(i.desc)}</p><button class="btn" onclick="openModal('assign')">Asignar</button>`,'card-box')).join('')}</div>`}
    function coachMessages(){const a=selectedAthlete();const msgs=state.messages[a.id]||[];return panel(`<h3>Mensajes con ${esc(a.name)}</h3><div style="margin-top:14px">${msgs.map(msg=>`<div class="msg ${msg.from==='me'?'me':''}"><p class="small">${msg.from==='coach'?'Coach':'Atleta'}</p>${esc(msg.text)}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:14px"><input id="coachMessage" value="Excelente avance. Mantén la carga controlada." style="flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);color:white;border-radius:12px;padding:12px"><button class="btn" onclick="sendCoachMessage()">Enviar</button></div>`,'table-panel')}
    function evaluationsModule(){const a=selectedAthlete(),m=metrics(a);return panel(`<h3>Evaluaciones</h3><div class="cards-grid" style="margin-top:14px">${metricBox('FMS','16/21','Actual')}${metricBox('Fatiga',a.fatigue+'/10','Actual')}${metricBox('Carga',String(m.load),'Actual')}</div>`,'table-panel')}
    function riskModule(){const sorted=[...state.athletes].sort((a,b)=>riskScore(b)-riskScore(a));return panel(`<h3>Risk Engine</h3><div style="margin-top:14px">${sorted.map(a=>`<button class="risk-row" onclick="selectAthlete(${a.id});setPage('coach','Atletas')"><b>${a.name}</b><span>${a.payment}</span>${badge(a.risk,riskColor(a.risk))}<span style="color:var(--cyan)">${riskScore(a)} pts</span></button>`).join('')}</div>`,'table-panel')}
    function reportsModule(){const km=state.athletes.reduce((s,a)=>s+Number(metrics(a).totalKm),0).toFixed(1);return panel(`<h3>Informes</h3><div class="cards-grid" style="margin-top:14px">${metricBox('Km equipo',km,'Historial')}${metricBox('Atletas',String(state.athletes.length),'Total')}${metricBox('Activos',String(state.athletes.filter(a=>a.status==='Activo').length),'Hoy')}${metricBox('Riesgo alto',String(state.athletes.filter(a=>a.risk==='Alto').length),'Atención')}</div>`,'table-panel')}
    function billingModule(){return panel(`<h3>Facturación y cobros</h3><div class="cards-grid" style="margin-top:14px">${state.athletes.map(a=>`<div class="history-item"><b>${a.name}</b><p class="small">Plan mensual atleta</p>${badge(a.payment,a.payment==='Pagado'?'green':a.payment==='Vencido'?'red':'amber')}</div>`).join('')}</div>`,'table-panel')}
    function settingsModule(){return panel(`<h3>Ajustes</h3><div class="cards-grid" style="margin-top:14px">${['Marca','Notificaciones','Permisos','Dominio','Métodos de pago','Integraciones'].map(i=>`<button class="market-card" onclick="toast('${i}','Configuración abierta en demo.')">⚙️<br><b>${i}</b></button>`).join('')}</div>`,'table-panel')}

    function athleteView(){const a=selectedAthlete();const page=state.page.athlete;const nav=['Resumen','Semana','Progreso','Historial','Mensajes','Marketplace','Ajustes'];return topbar()+`<div class="layout">${sidebar('athlete',nav)}<main class="stack">${pageHead(page,'Vista completa del atleta, sin preview móvil.')}${a.status!=='Activo'?`<div class="locked">${badge('🔒 Acceso restringido','red')}<h2>Tu plan está bloqueado.</h2><p class="small">Contacta a tu coach para reactivar el acceso o actualizar el pago.</p></div>`:''}${page==='Resumen'?athleteSummary(a):page==='Semana'?athleteWeek(a):page==='Progreso'?athleteProgress(a):page==='Historial'?athleteHistory(a):page==='Mensajes'?athleteMessages(a):page==='Marketplace'?marketplaceView():athleteSettings()}</main></div>`}
    function athleteSummary(a){const m=metrics(a);return `<div class="kpis">${kpi('✓','Cumplimiento',a.compliance+'%','Semana','green')}${kpi('📈','Carga',String(m.load),m.totalKm+' km')}${kpi('⚡','Fatiga',a.fatigue+'/10','Actual')}${kpi('🔥','Racha',a.streak+' días','Activa','green')}${kpi('⌚','Sync',a.strava||a.garmin?'Activo':'Pendiente','Garmin / Strava')}</div>${panel(`${badge('Sesión del día','cyan')}<h2>${esc(a.schedule.find(s=>s.title!=='Descanso')?.title||'Descanso')}</h2><p class="small">${esc(a.schedule.find(s=>s.title!=='Descanso')?.description||'Día de recuperación')}</p><div class="page-actions" style="margin-top:18px"><button class="btn" onclick="markDone()" ${a.status!=='Activo'?'disabled':''}>✓ Marcar como completada</button><button class="btn ghost" onclick="setPage('athlete','Semana')">Ver semana</button><button class="btn ghost" onclick="setPage('athlete','Mensajes')">Mensaje al coach</button></div>`,'table-panel')}`}
    function athleteWeek(a){return panel(`<div class="table-head"><div><h3>Semana actual visible</h3><p class="small">Las semanas anteriores y futuras permanecen bloqueadas para proteger el plan.</p></div>${badge('👁️ Protegida','cyan')}</div><div class="session-grid">${a.schedule.map(s=>`<div class="history-item">${badge(s.label,'cyan')}<h3>${esc(s.title)}</h3><p class="small">${esc(s.meta)}</p><p class="small">${esc(s.description)}</p></div>`).join('')}</div><div class="split2"><div class="history-item">🔒 Semanas anteriores bloqueadas</div><div class="history-item">🔒 Semanas futuras bloqueadas</div></div>`,'table-panel')}
    function athleteProgress(a){const m=metrics(a);return `<div class="kpis">${kpi('🏃','Km',m.totalKm,'Completados')}${kpi('✓','Sesiones',`${m.done.length}/${m.hist.length}`,m.completion+'%','green')}${kpi('📈','Carga',String(m.load),'Score')}${kpi('🎯','Fondo máx.',m.longest.km+' km',m.longest.type)}${kpi('⌚','FC prom.',m.avgHr?String(m.avgHr):'—','bpm')}</div>${panel(`<h3>Tendencia de carga</h3>${spark(m.trend)}${progress(m.completion)}<p class="small">Cumplimiento por historial completado: ${m.completion}%</p>`,'table-panel')}`}
    function athleteHistory(a){const m=metrics(a);return panel(`<h3>Historial de entrenamientos</h3><div class="cards-grid" style="margin-top:12px">${m.hist.map(h=>`<div class="history-item"><div style="display:flex;justify-content:space-between"><b>${h.type}</b>${badge(h.done?'Completado':'No completado',h.done?'green':'red')}</div><p class="small">${h.km} km · ${h.pace}/km · FC ${h.hr} · RPE ${h.rpe}</p></div>`).join('')}</div><h3 style="margin-top:20px">Récords</h3><div class="cards-grid">${Object.entries(a.records).map(([k,v])=>metricBox(k,v,'PR')).join('')}</div>`,'table-panel')}
    function athleteMessages(a){const msgs=state.messages[a.id]||[];return panel(`<h3>Mensajes con tu coach</h3><div style="margin-top:14px">${msgs.map(msg=>`<div class="msg ${msg.from==='me'?'me':''}"><p class="small">${msg.from==='coach'?'Coach':'Tú'}</p>${esc(msg.text)}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:14px"><input id="athleteMessage" placeholder="Responder al coach" style="flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);color:white;border-radius:12px;padding:12px"><button class="btn" onclick="sendAthleteMessage()">Enviar</button></div>`,'table-panel')}
    function marketplaceView(){return panel(`<div class="table-head"><h3>Marketplace</h3>${badge('Recursos premium','purple')}</div><div class="market-grid">${market.map(i=>`<button class="market-card" onclick="buyMarket('${i.title}')"><div style="font-size:28px">${i.icon}</div><b>${i.title}</b><p class="small">${i.sub}</p><p style="color:var(--cyan)">${money(i.price)}</p></button>`).join('')}</div>`,'table-panel')}
    function athleteSettings(){return panel(`<h3>Ajustes del atleta</h3><div class="cards-grid" style="margin-top:14px">${['Perfil','Notificaciones','Privacidad','Strava','Garmin','Pagos'].map(i=>`<button class="market-card" onclick="toast('${i}','Configuración abierta en demo.')">⚙️<br><b>${i}</b></button>`).join('')}</div>`,'table-panel')}

    function renderModal(){if(!state.modal)return'';const a=selectedAthlete();let c='';if(state.modal==='newAthlete')c=`<div class="forms-grid"><label class="field"><span>Nombre</span><input id="newAthleteName" placeholder="Nombre del atleta"></label><label class="field"><span>Email</span><input id="newAthleteEmail" placeholder="email@demo.com"></label></div><button class="btn" style="margin-top:14px" onclick="createAthlete()">+ Crear atleta</button>`;if(state.modal==='newCoach')c=`<div class="forms-grid"><label class="field"><span>Nombre</span><input id="newCoachName" placeholder="Nombre del coach"></label><label class="field"><span>Plan</span><select id="newCoachPlan"><option>Starter</option><option>Studio</option><option>Pro</option></select></label><label class="field"><span>Seats</span><input type="number" id="newCoachSeats" value="10"></label></div><button class="btn" style="margin-top:14px" onclick="createCoach()">Crear licencia</button>`;if(state.modal==='assign')c=`<div class="forms-grid"><label class="field"><span>Día destino</span><select id="assignDay">${dayNames.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><label class="field"><span>Plantilla</span><select id="assignTpl">${state.library.map(i=>`<option value="${i.id}">${esc(i.title)}</option>`).join('')}</select></label></div><div class="cards-grid" style="margin-top:14px">${state.library.map(i=>`<div class="history-item"><b>${esc(i.title)}</b><p class="small">${esc(i.desc)}</p></div>`).join('')}</div><button class="btn" style="margin-top:14px" onclick="assignSession()">Asignar sesión</button>`;if(state.modal==='release')c=`<div class="forms-grid"><label class="field"><span>Distancia</span><select id="releaseDistance" onchange="render()">${Object.keys(planWeeks).map(d=>`<option>${d}</option>`).join('')}</select></label><label class="field"><span>Semana</span><select id="releaseWeek"><option value="1">Semana 1</option><option value="2">Semana 2</option><option value="3">Semana 3</option><option value="4">Semana 4</option></select></label></div><div class="week-grid" style="margin-top:14px">${Object.entries(planWeeks).map(([d,loads])=>loads.map((load,i)=>`<button class="history-item" onclick="document.getElementById('releaseDistance').value='${d}';document.getElementById('releaseWeek').value='${i+1}'">${badge(d,'cyan')}<h3>Semana ${i+1}</h3><p class="small">${load} km</p></button>`).join('')).join('')}</div><button class="btn" style="margin-top:14px" onclick="releaseWeek()">Aplicar semana</button>`;if(state.modal==='message')c=`<label class="field"><span>Mensaje para ${esc(a.name)}</span><textarea id="coachMessage">Excelente avance. Mantén la carga controlada y reporta fatiga al terminar.</textarea></label><button class="btn" style="margin-top:14px" onclick="sendCoachMessage();closeModal()">Enviar</button>`;return `<div class="modal-wrap"><div class="modal-bg" onclick="closeModal()"></div><div class="panel modal"><div class="modal-title"><h3>${state.modal==='newAthlete'?'Nuevo atleta':state.modal==='newCoach'?'Nueva licencia coach':state.modal==='assign'?'Asignar sesión':state.modal==='release'?'Liberar semana':'Mensaje'}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>${c}</div></div>`}

    function render(){document.documentElement.style.setProperty('--brand',state.brandColor);let html='';if(!state.session)html=renderLogin();else if(state.session.role==='admin')html=adminView();else if(state.session.role==='coach')html=coachView();else html=athleteView();html+=renderModal();if(state.notice)html+=`<div class="panel toast"><div style="display:flex;gap:12px"><div style="font-size:24px;color:var(--cyan)">✓</div><div style="flex:1"><b>${esc(state.notice.title)}</b><p class="small">${esc(state.notice.message)}</p></div><button class="btn ghost" onclick="closeToast()">✕</button></div></div>`;document.getElementById('root').innerHTML='<div class="app">'+html+'</div>'}
    render();
  </script>
</body>
</html>
